[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "topwater"
version = "0.1.0.dev0"
description = "Nonlinear wave-body dynamics in Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Osborne" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.urls]
Repository = "https://github.com/amosborne/topwater"
Issues = "https://github.com/amosborne/topwater/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/topwater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
