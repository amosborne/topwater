name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest

  packaging:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - run: uv run --locked python scripts/check_distributions.py

  physical-qualification:
    name: Physical baseline qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group correlation
      - name: Freeze current canonical physical inputs
        run: uv run --locked python -m tests.validation freeze --output artifacts/validation/frozen.json
      - name: Require every physical promotion gate
        # Expected to fail while accepted references/comparisons are absent or
        # the selected implementation lacks time-domain wave support.
        # CI never generates convergence data or blesses missing cases.
        run: >-
          uv run --locked python -m tests.validation qualify
          --frozen artifacts/validation/frozen.json
          --reference validation/accepted/reference.json
          --inertia validation/accepted/inertia.json
          --waves validation/accepted/waves.json
          --output artifacts/validation/qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-physical-qualification
          path: artifacts/validation/
          if-no-files-found: error
