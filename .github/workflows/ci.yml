name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest

  packaging:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv build
      - run: uv run --locked python scripts/check_distributions.py

  capytaine-rankine:
    name: Capytaine kernels, hydrostatics and instantaneous inertia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group correlation
      - run: uv run --locked --group correlation python -c "import capytaine"
      - run: uv run --locked --group correlation pytest tests/test_capytaine_rankine.py tests/test_capytaine_hydrostatics.py tests/test_capytaine_inertia.py
      - run: uv run --locked --group correlation python -m tests.experiments.free_surface.canoe --study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capytaine-correlation-report
          path: |
            artifacts/capytaine-*.json
            artifacts/free-surface-canoe.json
          if-no-files-found: warn

  experimental-free-surface:
    name: Experimental free-surface evidence (not qualification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m tests.experiments.free_surface.verify
      - run: uv run --locked python -m tests.experiments.free_surface.evolution
      - run: uv run --locked python -m tests.experiments.free_surface.linear
      - run: uv run --locked python -m tests.experiments.free_surface.shape_check
      - run: uv run --locked python -m tests.experiments.free_surface.benchmark
      - run: uv run --locked python -m tests.experiments.free_surface.benchmark --canoe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-free-surface-reports
          path: artifacts/free-surface-*.json
          if-no-files-found: warn
